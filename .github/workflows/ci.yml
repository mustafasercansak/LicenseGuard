name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  validate:
    name: Validate
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Validate lg-policy.json
        shell: pwsh
        run: |
          $policy = Get-Content lg-policy.json -Raw | ConvertFrom-Json
          $rules  = $policy.rules
          Write-Host "Policy rules loaded: $($rules.Count)"

          $ids = $rules | ForEach-Object { $_.id }
          $duplicates = $ids | Group-Object | Where-Object { $_.Count -gt 1 }
          if ($duplicates) {
            $duplicates | ForEach-Object { Write-Error "Duplicate policy ID: $($_.Name)" }
            exit 1
          }

          $validStatuses   = @('ALLOWED','REQUIRES_LICENSE','PROHIBITED')
          $validMatchTypes = @('contains','startsWith','exact','regex')
          $invalid = $rules | Where-Object {
            $validStatuses  -notcontains $_.status    -or
            $validMatchTypes -notcontains $_.matchType -or
            [string]::IsNullOrWhiteSpace($_.id)       -or
            [string]::IsNullOrWhiteSpace($_.pattern)
          }
          if ($invalid) {
            $invalid | ForEach-Object { Write-Error "Invalid rule: $($_.id) — status=$($_.status) matchType=$($_.matchType)" }
            exit 1
          }

          Write-Host "All $($rules.Count) policy rules are valid."

      - name: Validate lg-config.example.json
        shell: pwsh
        run: |
          $cfg = Get-Content lg-config.example.json -Raw | ConvertFrom-Json
          Write-Host "Config example parsed OK"

      - name: PSScriptAnalyzer
        shell: pwsh
        run: |
          Install-Module PSScriptAnalyzer -Force -Scope CurrentUser -ErrorAction Stop
          $results = Invoke-ScriptAnalyzer -Path LicenseGuard.ps1 -Severity Error
          if ($results) {
            $results | Format-Table -AutoSize
            exit 1
          }
          Write-Host "PSScriptAnalyzer: no errors found."

      - name: Syntax check — TestPolicy mode
        shell: pwsh
        run: |
          .\LicenseGuard.ps1 -TestPolicy -ConsoleOnly -NoUpdateCheck
