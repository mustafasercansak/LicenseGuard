name: PowerShell CI

on:
  push:
    branches: [ master, updates ]
  pull_request:
    branches: [ master ]

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Run Pester tests
        shell: pwsh
        run: |
          Invoke-Pester -Path .\LicenseGuard\Tests -Output Detailed
