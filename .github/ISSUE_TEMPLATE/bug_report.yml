name: Bug report
description: Report a reproducible problem in LicenseGuard.
title: "[Bug]: "
labels:
  - bug
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What happened?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: List the exact command and sample project/report input if possible.
      placeholder: |
        1. Run ...
        2. Open ...
        3. See ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: LicenseGuard version
      placeholder: "3.0.0"
  - type: input
    id: powershell
    attributes:
      label: PowerShell version
      placeholder: "7.4.x / 5.1"
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, project type, package manager, or binary/SBOM format.
      placeholder: "Windows 11, NPM project, CycloneDX SBOM"
  - type: textarea
    id: logs
    attributes:
      label: Relevant output
      render: text
